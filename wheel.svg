<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
    <!-- Outer Leather Rim -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="#222" stroke-width="10"/>
    <circle cx="50" cy="50" r="45" fill="none" stroke="#444" stroke-width="6"/>
    
    <!-- Metallic Spokes -->
    <polygon points="50,50 8,50 12,42 50,45" fill="#777"/> <!-- Left Spoke -->
    <polygon points="50,50 92,50 88,42 50,45" fill="#777"/> <!-- Right Spoke -->
    <polygon points="50,50 42,90 58,90" fill="#777"/>       <!-- Bottom Spoke -->
    
    <!-- Center Horn Pad -->
    <circle cx="50" cy="50" r="15" fill="#111" stroke="#333" stroke-width="2"/>
    <circle cx="50" cy="50" r="6" fill="none" stroke="#00ffff" stroke-width="1.5"/>
</svg>

            <stop offset="70%" stop-color="#111"/><stop offset="100%" stop-color="#333"/>
        </radialGradient>
    </defs>
    <!-- Outer grip -->
    <circle cx="60" cy="60" r="54" fill="none" stroke="url(#grad)" stroke-width="12" />

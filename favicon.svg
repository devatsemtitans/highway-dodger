<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Road background -->
  <rect width="64" height="64" rx="12" fill="#1a1a2e"/>
  <!-- Road strip -->
  <rect x="24" y="0" width="16" height="64" rx="2" fill="#3a3a3a"/>
  <!-- Center dashes -->
  <rect x="30" y="8"  width="4" height="12" rx="1" fill="#FFD700"/>
  <rect x="30" y="27" width="4" height="12" rx="1" fill="#FFD700"/>
  <rect x="30" y="46" width="4" height="12" rx="1" fill="#FFD700"/>
  <!-- Car body -->
  <rect x="22" y="30" width="20" height="14" rx="4" fill="#D32F2F"/>
  <!-- Car roof/window -->
  <rect x="25" y="22" width="14" height="10" rx="3" fill="#D32F2F"/>
  <rect x="27" y="24" width="10" height="7"  rx="2" fill="#111"/>
  <!-- Headlights -->
  <rect x="22" y="42" width="6" height="3" rx="1" fill="#FFF176"/>
  <rect x="36" y="42" width="6" height="3" rx="1" fill="#FFF176"/>
  <!-- Wheels -->
  <circle cx="26" cy="46" r="4" fill="#222"/>
  <circle cx="26" cy="46" r="2" fill="#555"/>
  <circle cx="38" cy="46" r="4" fill="#222"/>
  <circle cx="38" cy="46" r="2" fill="#555"/>
</svg>
